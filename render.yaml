services:
  - type: web
    name: ai-cv-generator
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://ai-cv-generator-be-production.up.railway.app
